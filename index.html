            if (slug.includes('pdf') || slug.includes('tiff')) return 'PDF & Document Tools';
            if (slug.includes('image') || slug.includes('jpg') || slug.includes('png') || slug.includes('webp') || slug.includes('gif') || slug.includes('pfp') || slug.includes('exif') || slug.includes('sprite') || slug.includes('heic') || slug.includes('avif') || slug.includes('color') || slug.includes('dpi')) return 'Image & Graphic Tools';

            if (slug.includes('json') || slug.includes('jwt') || slug.includes('sql') || slug.includes('css') || slug.includes('html') || slug.includes('js') || slug.includes('regex') || slug.includes('hash') || slug.includes('base64') || slug.includes('uuid') || slug.includes('minifier') || slug.includes('validator') || slug.includes('xml') || slug.includes('yaml') || slug.includes('chmod') || slug.includes('code') || slug.includes('binary')) return 'Developer & Coding Tools';
            if (slug.includes('seo') || slug.includes('meta') || slug.includes('tag') || slug.includes('redirect') || slug.includes('sitemap') || slug.includes('slug') || slug.includes('checker') || slug.includes('speed') || slug.includes('robots') || slug.includes('hreflang') || slug.includes('canonical') || slug.includes('http')) return 'SEO & Webmaster Tools';
            if (slug.includes('youtube') || slug.includes('instagram') || slug.includes('tiktok') || slug.includes('twitter') || slug.includes('discord') || slug.includes('twitch') || slug.includes('whatsapp') || slug.includes('telegram') || slug.includes('social') || slug.includes('hashtag')) return 'Social Media & Creator Tools';
            return 'Text & Productivity Generators';
        }

        // Title Auto-Formatter
        function formatTitle(slug) {
            return slug
                .replace(/-/g, ' ')
                .replace(/_/g, ' ')
                .replace(/\b\w/g, char => char.toUpperCase())
                .replace('Pdf', 'PDF')
                .replace('Jpg', 'JPG')
                .replace('Png', 'PNG')
                .replace('Css', 'CSS')
                .replace('Js', 'JS')
                .replace('Html', 'HTML')
                .replace('Json', 'JSON')
                .replace('Seo', 'SEO')
                .replace('Yt', 'YouTube')
                .replace('Ig', 'Instagram')
                .replace('Wa', 'WhatsApp');
        }

        const categorizedTools = {};

            if (!categorizedTools[cat]) categorizedTools[cat] = [];
            categorizedTools[cat].push(slug);
        });
