name: Auto-generate image sitemap

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Critical: This gives the action permission to push changes back to your repo
permissions:
  contents: write

jobs:
  generate-image-sitemap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate image-sitemap.xml
        run: |
          node <<'EOF'
          const fs = require('fs');
          const path = require('path');

          const SITE_URL = 'https://simpliconvert.com';
          const IMAGES_DIR = 'images';
          const OUTPUT = 'image-sitemap.xml';

          // If the images folder doesn't exist, exit safely
          if (!fs.existsSync(IMAGES_DIR)) {
            process.exit(0);
          }

          function walk(dir) {
            let results = [];
            fs.readdirSync(dir).forEach(file => {
              const fullPath = path.join(dir, file);
              if (fs.statSync(fullPath).isDirectory()) {
                results = results.concat(walk(fullPath));
              } else if (/\.(png|jpe?g|gif|webp|svg)$/i.test(file)) {
                results.push(fullPath);
              }
            });
            return results;
          }

          const images = walk(IMAGES_DIR);

          let xml = `<?xml version="1.0" encoding="UTF-8"?>\n`;
          xml += `<urlset xmlns="http://www.sitemaps.org/schemas/sitemap/0.9"\n`;
          xml += `        xmlns:image="http://www.google.com/schemas/sitemap-image/1.1">\n`;

          if (images.length > 0) {
            // Map all images to the homepage URL since they are in a flat folder
            xml += `  <url>\n`;
            xml += `    <loc>${SITE_URL}/</loc>\n`;
            
            images.forEach(img => {
              // Convert Windows backslashes to forward slashes for URLs
              const relativePath = img.split(path.sep).join('/');
              const imgUrl = `${SITE_URL}/${relativePath}`;
              
              // SEO Trick: Clean filename to create a Title
              // "add-line-breaks-guide.jpg" -> "Add Line Breaks Guide"
              const fileName = path.basename(img, path.extname(img));
              const title = fileName.split(/[-_]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');

              xml += `    <image:image>\n`;
              xml += `      <image:loc>${imgUrl}</image:loc>\n`;
              xml += `      <image:title>${title}</image:title>\n`;
              xml += `      <image:caption>${title} on SimpliConvert</image:caption>\n`;
              xml += `    </image:image>\n`;
            });
            
            xml += `  </url>\n`;
          }

          xml += `</urlset>`;

          fs.writeFileSync(OUTPUT, xml.trim());
          console.log(`Generated ${OUTPUT} with ${images.length} images including SEO metadata.`);
          EOF

      - name: Commit image sitemap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add image-sitemap.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate image sitemap"
            git push
          fi
