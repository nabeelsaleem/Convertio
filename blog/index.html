        // Formatting Function
        function formatTitle(url) {
            // Extract the slug from the URL
            let slug = url.split('/').filter(Boolean).pop();
            
            // Replace hyphens and underscores with spaces
            let title = slug.replace(/[-_]/g, ' ');

            // Capitalize each word
            title = title.replace(/\b\w/g, char => char.toUpperCase());

            // Fix common acronyms perfectly
            title = title.replace(/\b(Pdf|Json|Html|Xml|Csv|Url|Cpm|Bmi|Ai|Seo|Jwt|Utm|Jpg|Png|Gif)\b/ig, match => match.toUpperCase());

            return title;
        }

        }

        // Render Grid
        function renderGrid(blogsToRender) {
            const grid = document.getElementById('blogGrid');
            const emptyState = document.getElementById('emptyState');
            const resultsCount = document.getElementById('resultsCount');
            
            grid.innerHTML = '';
            
            if (blogsToRender.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                resultsCount.textContent = '0 guides found';
            } else {
                grid.classList.remove('hidden');
                emptyState.classList.add('hidden');
                resultsCount.textContent = `Showing ${blogsToRender.length} guides`;
                
                blogsToRender.forEach(blog => {
                    grid.insertAdjacentHTML('beforeend', createCardHTML(blog));
                });
            }
        }

        // Initialization
        document.addEventListener('DOMContentLoaded', () => {
            
            // 1. Load Navbar & Footer components
            async function loadComponent(url, elementId, callback) {
                try {
                    const response = await fetch(url);
                    if (!response.ok) throw new Error('Failed');
                    document.getElementById(elementId).innerHTML = await response.text();
                    if (callback) callback();
                } catch (error) {
                    console.error('Error loading component:', error);
                }
            }

            function initializeHeaderScripts() {
                const header = document.getElementById('navbar');
                if (header) {
                    window.addEventListener('scroll', () => {
                        if (window.scrollY > 10) header.classList.add('scrolled-effect');
                        else header.classList.remove('scrolled-effect');
                    });
                }
                const mobileMenuBtn = document.getElementById('mobile-menu-button');
                const mobileMenu = document.getElementById('mobile-menu');
                if (mobileMenuBtn && mobileMenu) {
                    mobileMenuBtn.addEventListener('click', () => {
                        mobileMenu.classList.toggle('open');
                    });
                }
            }

            function initializeFooterScripts() {
                const yearSpan = document.getElementById('current-year');
                if(yearSpan) yearSpan.textContent = new Date().getFullYear();
            }

            loadComponent('/components/navbar.html', 'navbar', initializeHeaderScripts);
            loadComponent('/components/footer.html', 'footer', initializeFooterScripts);

            // 2. Parse Blogs
            parsedBlogs = blogUrls.map(url => ({
                url: url,
                title: formatTitle(url)
            }));

            // Sort alphabetically for neatness
            parsedBlogs.sort((a, b) => a.title.localeCompare(b.title));

            // Initial render
            renderGrid(parsedBlogs);

            // 3. Search Logic
            const searchInput = document.getElementById('searchInput');
            searchInput.addEventListener('input', (e) => {
                const searchTerm = e.target.value.toLowerCase();
                const filteredBlogs = parsedBlogs.filter(blog => 
                    blog.title.toLowerCase().includes(searchTerm)
                );
                renderGrid(filteredBlogs);
            });
        });
    </script>
<script>
(function unhideWhenReady() {
    var checkCount = 0;
    var maxChecks = 100; // wait up to 5 seconds
    var interval = setInterval(function() {
        var navbar = document.getElementById('navbar');
        var footer = document.getElementById('footer');
        if ((navbar && navbar.innerHTML.trim() !== '') && (footer && footer.innerHTML.trim() !== '')) {
            var hideStyle = document.getElementById('hide-page');
            if (hideStyle) hideStyle.remove();
            clearInterval(interval);
        } else if (++checkCount >= maxChecks) {
            // fallback – unhide anyway after timeout to avoid blank page
            var hideStyle = document.getElementById('hide-page');
            if (hideStyle) hideStyle.remove();
            clearInterval(interval);
        }
    }, 50);
})();
</script>
